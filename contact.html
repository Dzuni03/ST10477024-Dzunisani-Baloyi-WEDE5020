        <body>
            <p>
            <h2>Contact Form</h2>
            </p>
        </body>

        <form id="contactForm" action="https://formsubmit.co/gavin@shoutsa.com" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" minlength="2" maxlength="50" required>
            <br><br>
            <label for="surname">Surname:</label>
            <input type="text" id="surname" name="surname" minlength="2" maxlength="50" required>
            <br><br>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9 +()-]{7,20}" title="Enter a valid phone number."
                required>
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>
            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" minlength="3" maxlength="100" required>
            <br><br>
            <label for="message">Message:</label>
            <textarea id="message" name="message" minlength="10" maxlength="2000" rows="5" required></textarea>
            <br><br>
            <p id="form-error" role="alert"></p>
            <p id="form-status" role="status" aria-live="polite"></p>

            <button type="submit">Send</button>
        </form>
